<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Clone</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .header h2 {
            margin: 0;
        }

        .messages {
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .message {
            margin-bottom: 10px;
        }

        .message .sender {
            font-weight: bold;
            margin-right: 5px;
        }

        .message .content {
            display: inline-block;
        }

        .input-container {
            margin-top: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="user_image.jpg" alt="User Image"> 
            <h2>John Doe</h2>
        </div>

        <div class="messages">
            <div class="message">
                <span class="sender">John Doe:</span>
                <span class="content">Hello!</span>
            </div>
            <div class="message">
                <span class="sender">You:</span>
                <span class="content">Hi there!</span>
            </div>
            <div class="message">
                <span class="sender">John Doe:</span>
                <span class="content">How are you?</span>
            </div>
        </div>

        <div class="input-container">
            <input type="text" placeholder="Type your message...">
            <button>Send</button>
        </div>
    </div>

</body>
</html>
